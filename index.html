<!DOCTYPE html>
<html>
<head>
  <title>Minecraft Elsa</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #b3e5ff;
      color: #003366;
      text-align: center;
    }

    header {
      background-color: #0099ff;
      padding: 30px;
      color: white;
    }

    h1 {
      font-size: 45px;
    }

    .cube {
      width: 120px;
      height: 120px;
      background-color: #00bfff;
      border: 6px solid #006699;
      display: inline-block;
      margin: 20px;
      box-shadow: 10px 10px #005580;
    }

    .section {
      padding: 40px;
    }

    .ad-box {
      background-color: #e6f7ff;
      border: 5px solid #0099ff;
      padding: 25px;
      margin: 30px auto;
      width: 70%;
    }

    button {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      cursor: pointer;
    }

    footer {
      background-color: #005580;
      color: white;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>❄ Minecraft Elsa ❄</h1>
    <p>Welcome to Elsa's Blue Cube World!</p>
  </header>

  <div class="section">
    <div class="cube"></div>
    <div class="cube"></div>
    <div class="cube"></div>

    <div class="ad-box">
      <h2>Play Minecraft Today!</h2>
      <p>
        Build castles, explore icy lands, mine blocks, and create your own cube adventure.
        Minecraft is full of imagination, creativity, and fun!
      </p>
      <button>Start Building</button>
    </div>

    <div class="cube"></div>
    <div class="cube"></div>
    <div class="cube"></div>
  </div>

  <footer>
    <p>Made by Minecraft Elsa | Blue Cube Kingdom</p>
  </footer>

</body>
</html>
